# 论文列表(按时间倒序)。
# 字段说明:
#   title            论文标题
#   authors          作者列表(自己的名字用 <strong> 加粗)
#   conference_short 会议/期刊缩写(显示在题图角标上,需配合 image)
#   conference       完整的会议/期刊名称与年份
#   pdf              PDF 或 arXiv 链接
#   code             代码仓库链接(可选)
#   page             论文主页链接,指向本站 ./papers/<论文名>/ 子页面(可选)
#   bibtex           BibTeX 链接(可选)
#   image            题图(teaser),放在 ./assets/img/ 下(可选)
#   notes            高亮备注,如 Oral / Spotlight / Best Paper(可选)
#   s2id             Semantic Scholar 论文 ID,用于自动显示引用量(可选)
#                    可以填 arXiv:<id>、DOI:<doi> 或 S2 的 paperId

