name: Update Google Scholar citations

# 注意:GitHub Actions 数据中心 IP 会被 Google Scholar 屏蔽,定时抓取已改由
# 本地服务器 cron 运行 scripts/update_gs_stats.sh 完成。此 workflow 仅保留
# 手动触发入口,作为备用(不保证成功)。
on:
  workflow_dispatch: {} # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch citation data from Google Scholar
        env:
          GOOGLE_SCHOLAR_ID: gAfFuhsAAAAJ
        run: python scripts/fetch_gs_citations.py

      - name: Publish gs_data.json to google-scholar-stats branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: google-scholar-stats
          publish_dir: ./gs-output
          force_orphan: true
